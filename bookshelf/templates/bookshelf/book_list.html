<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Bookshelf</title>
</head>
<body>
    <h1>Bookshelf Collection</h1>
    <hr>
    <ul>
        {% for book in books %}
            <li><strong>{{ book.title }}</strong> by {{ book.author }} (Published: {{ book.published_date }})</li>
        {% empty %}
            <li> books in your library </li>
        {% endfor %}
            <li>book one at your library</li>
            <li>book two at your library</li>
            <li>book three at library</li>
    </ul>
</body>
</html>
